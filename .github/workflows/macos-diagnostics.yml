name: Diagnose published macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-26:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10.19'
          architecture: arm64
      - run: python -m pip install -r agent/requirements-build.txt
      - name: Inspect exact published packages and run native upgrade checks
        run: python tools/diagnose_macos.py
