name: Diagnose published macOS packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
        download: [local, quarantine]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          # Only the test harness uses this interpreter; released binaries retain theirs.
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r agent/requirements-build.txt
      - name: Launch exact published installer from mounted DMG and copied app
        env:
          DOWNLOAD_MODE: ${{ matrix.download }}
        run: |
          if [ "$DOWNLOAD_MODE" = quarantine ]; then
            python tools/diagnose_macos.py --quarantine
          else
            python tools/diagnose_macos.py
          fi
