name: Publish runtime delivery
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Accepted stable version
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: runtime-delivery-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10.19'
      - name: Verify accepted archives and publish runtime files
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: python tools/delivery.py
