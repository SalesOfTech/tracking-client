name: Compare published ARM initial installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        version: ['3.4.1', '3.5.0', '3.5.1']
        download: [local, quarantine]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r agent/requirements-build.txt
      - name: Compare exact release and normal initial setup, never publish
        env:
          VERSION: ${{ matrix.version }}
          DOWNLOAD_MODE: ${{ matrix.download }}
        run: |
          args=(--version "$VERSION" --evidence "$RUNNER_TEMP/evidence")
          if [ "$DOWNLOAD_MODE" = quarantine ]; then args+=(--quarantine); fi
          python tools/compare_macos_installers.py "${args[@]}"
      - name: Retain comparison and screenshots even on launch failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.version }}-${{ matrix.download }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error
