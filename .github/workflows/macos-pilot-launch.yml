name: Diagnose ARM pilot Finder launch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        download: [local, quarantine]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r agent/requirements-build.txt
      - name: Open exact pilot through LaunchServices, never enroll or publish
        env:
          DOWNLOAD_MODE: ${{ matrix.download }}
        run: |
          if [ "$DOWNLOAD_MODE" = quarantine ]; then
            python tools/diagnose_macos.py --pilot --quarantine
          else
            python tools/diagnose_macos.py --pilot
          fi
